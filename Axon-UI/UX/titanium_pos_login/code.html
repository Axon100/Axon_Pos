<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Titan POS - Enterprise Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#007d36",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#002109",
                        "surface-container-high": "#2a2a2a",
                        "tertiary-fixed-dim": "#4ae176",
                        "secondary-fixed": "#e2e2e2",
                        "primary-fixed-dim": "#ffb3af",
                        "secondary": "#c6c6c7",
                        "inverse-primary": "#bf0022",
                        "on-tertiary-fixed-variant": "#005321",
                        "primary-fixed": "#ffdad7",
                        "tertiary-fixed": "#6bff8f",
                        "on-secondary": "#2f3131",
                        "on-tertiary": "#003915",
                        "on-primary-fixed": "#410005",
                        "on-secondary-fixed": "#1a1c1c",
                        "outline": "#ae8885",
                        "on-surface-variant": "#e7bcba",
                        "on-primary-container": "#ffeae8",
                        "primary-container": "#d90429",
                        "outline-variant": "#5d3f3d",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0e0e0e",
                        "background": "#131313",
                        "surface-variant": "#353534",
                        "secondary-container": "#454747",
                        "tertiary": "#4ae176",
                        "inverse-surface": "#e5e2e1",
                        "surface-container-low": "#1c1b1b",
                        "on-background": "#e5e2e1",
                        "primary": "#ffb3af",
                        "on-primary": "#68000e",
                        "on-error-container": "#ffdad6",
                        "surface": "#131313",
                        "on-secondary-fixed-variant": "#454747",
                        "error-container": "#93000a",
                        "surface-tint": "#ffb3af",
                        "surface-bright": "#3a3939",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-surface": "#e5e2e1",
                        "on-tertiary-container": "#b9ffbf",
                        "inverse-on-surface": "#313030",
                        "on-secondary-container": "#b4b5b5",
                        "surface-container": "#201f1f",
                        "surface-container-highest": "#353534",
                        "on-primary-fixed-variant": "#930018",
                        "surface-dim": "#131313"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "margin": "24px",
                        "xl": "48px",
                        "sm": "8px",
                        "md": "16px",
                        "gutter": "16px",
                        "xs": "4px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"],
                        "display-lg": ["Hanken Grotesk"],
                        "title-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #2C2C2C;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .input-focus-ring:focus {
            border-color: #D90429;
            box-shadow: 0 0 0 2px rgba(217, 4, 41, 0.2);
            outline: none;
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(217,4,41,0.15) 0%, rgba(17,17,17,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center relative font-body-md text-body-md antialiased selection:bg-primary-container selection:text-white">
<!-- Ambient Glow Background -->
<div class="ambient-glow"></div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md px-margin md:px-0">
<div class="glass-panel rounded-xl p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-sm">
<div class="w-12 h-12 bg-surface-container rounded-lg flex items-center justify-center mb-sm border border-outline-variant">
<span class="material-symbols-outlined text-primary-container" style="font-size: 28px; font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Titan POS</h1>
<p class="font-label-md text-label-md text-secondary uppercase tracking-wider">Enterprise Terminal 01</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-md mt-sm" method="POST">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-secondary" for="username">Operator ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary" style="font-size: 20px;">badge</span>
<input class="w-full bg-[#1A1A1A] border border-[#2C2C2C] rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-surface-variant font-body-md text-body-md input-focus-ring transition-all" id="username" name="username" placeholder="Enter ID number" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-secondary" for="password">Passcode</label>
<a class="font-label-md text-label-md text-primary-container hover:text-white transition-colors" href="#">Forgot Passcode?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary" style="font-size: 20px;">lock</span>
<input class="w-full bg-[#1A1A1A] border border-[#2C2C2C] rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-surface-variant font-body-md text-body-md input-focus-ring transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-[#D90429] hover:bg-[#EF233C] text-white font-title-md text-title-md py-3 px-4 rounded-lg mt-sm transition-colors flex items-center justify-center gap-2 group active:scale-[0.98]" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<div class="mt-xs text-center">
<p class="font-label-md text-label-md text-surface-variant">System Version 4.2.0 • Secure Connection</p>
</div>
</div>
</main>
</body></html>
